<svg width="880" height="520" viewBox="0 0 880 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spaceGlow" cx="440" cy="260" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E162E"/>
      <stop offset="60%" stop-color="#080C1A"/>
      <stop offset="100%" stop-color="#05070F"/>
    </radialGradient>

    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA726" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#FF7043" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#FF7043" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#05070F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCoreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="30%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </radialGradient>

    <radialGradient id="planetShade" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cometTail2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0"/>
      <stop offset="85%" stop-color="#EC4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="sunBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="880" height="520" rx="14" fill="url(#spaceGlow)"/>
  <rect x="0.5" y="0.5" width="879" height="519" rx="13.5" stroke="#1E293B" stroke-width="1"/>

  <g id="starfield">
    <circle cx="45" cy="35" r="1.2" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="110" cy="80" r="0.8" fill="#F8FAFC" opacity="0.4"/>
    <circle cx="180" cy="40" r="1.0" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="270" cy="75" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="350" cy="30" r="1.1" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="430" cy="60" r="0.9" fill="#F8FAFC" opacity="0.5"/>
    <circle cx="510" cy="25" r="1.4" fill="#F8FAFC" opacity="0.9"/>
    <circle cx="600" cy="70" r="0.8" fill="#F8FAFC" opacity="0.4"/>
    <circle cx="690" cy="45" r="1.2" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="770" cy="30" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="840" cy="85" r="1.0" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="820" cy="160" r="0.8" fill="#F8FAFC" opacity="0.4"/>
    <circle cx="850" cy="250" r="1.1" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="830" cy="340" r="0.9" fill="#F8FAFC" opacity="0.5"/>
