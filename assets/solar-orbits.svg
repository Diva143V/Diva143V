    <circle cx="780" cy="480" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="700" cy="460" r="1.0" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="620" cy="490" r="0.8" fill="#F8FAFC" opacity="0.4"/>
    <circle cx="530" cy="475" r="1.2" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="440" cy="500" r="0.9" fill="#F8FAFC" opacity="0.5"/>
    <circle cx="350" cy="470" r="1.1" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="260" cy="495" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="170" cy="460" r="1.0" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="90" cy="485" r="0.8" fill="#F8FAFC" opacity="0.4"/>
    <circle cx="30" cy="440" r="1.2" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="50" cy="350" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="25" cy="260" r="1.0" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="40" cy="170" r="0.9" fill="#F8FAFC" opacity="0.5"/>
    <circle cx="130" cy="150" r="0.6" fill="#F8FAFC" opacity="0.25"/>
    <circle cx="200" cy="190" r="0.5" fill="#F8FAFC" opacity="0.2"/>
    <circle cx="680" cy="180" r="0.6" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="740" cy="220" r="0.5" fill="#F8FAFC" opacity="0.2"/>
    <circle cx="160" cy="340" r="0.6" fill="#F8FAFC" opacity="0.25"/>
    <circle cx="220" cy="380" r="0.5" fill="#F8FAFC" opacity="0.2"/>
    <circle cx="660" cy="350" r="0.6" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="720" cy="390" r="0.5" fill="#F8FAFC" opacity="0.2"/>
    <circle cx="380" cy="120" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="500" cy="130" r="0.6" fill="#F8FAFC" opacity="0.25"/>
    <circle cx="370" cy="400" r="0.7" fill="#F8FAFC" opacity="0.3"/>
    <circle cx="510" cy="390" r="0.6" fill="#F8FAFC" opacity="0.25"/>
  </g>

  <g id="planetary_system">

    <!-- Orbit 1: Python -->
    <path id="orbit_0" d="M 305,260 a 135,65 0 1,0 270,0 a 135,65 0 1,0 -270,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
        
    <g>
      <animateMotion path="M 305,260 a 135,65 0 1,0 270,0 a 135,65 0 1,0 -270,0" dur="18s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="13" fill="#38BDF8" filter="url(#planetShade)"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="0" y="-17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">Python</text>
      
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
          <circle cx="22" cy="0" r="3.5" fill="#F8FAFC"/>
          <text x="27" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">Griffin Bio</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="6.5s" repeatCount="indefinite"/>
          <circle cx="34" cy="0" r="3.0" fill="#F472B6"/>
          <text x="39" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">SyGriffin</text>
        </g>
    </g>
        
    <!-- Orbit 2: C# -->
    <path id="orbit_1" d="M 250,260 a 190,95 0 1,0 380,0 a 190,95 0 1,0 -380,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
        
    <g>
      <animateMotion path="M 250,260 a 190,95 0 1,0 380,0 a 190,95 0 1,0 -380,0" dur="29s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="#C084FC" filter="url(#planetShade)"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1"/>
      <text x="0" y="-16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">C#</text>
      
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
          <circle cx="24" cy="0" r="4.0" fill="#F8FAFC"/>
          <text x="29" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">LiveSubs (7★)</text>
        </g>
    </g>
        
    <!-- Orbit 3: Rust -->
    <path id="orbit_2" d="M 195,260 a 245,125 0 1,0 490,0 a 245,125 0 1,0 -490,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
        
    <g>
      <animateMotion path="M 195,260 a 245,125 0 1,0 490,0 a 245,125 0 1,0 -490,0" dur="42s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#FB923C" filter="url(#planetShade)"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#FB923C" stroke-opacity="0.35" stroke-width="1"/>
      <text x="0" y="-15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">Rust</text>
      
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
          <circle cx="22" cy="0" r="3.5" fill="#F8FAFC"/>
          <text x="27" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">Knox (2★)</text>
        </g>
    </g>
        
    <!-- Orbit 4: TypeScript -->
    <path id="orbit_3" d="M 140,260 a 300,155 0 1,0 600,0 a 300,155 0 1,0 -600,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
        
    <g>
      <animateMotion path="M 140,260 a 300,155 0 1,0 600,0 a 300,155 0 1,0 -600,0" dur="56s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="10" fill="#60A5FA" filter="url(#planetShade)"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="1"/>
      <text x="0" y="-14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">TypeScript</text>
      
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
          <circle cx="20" cy="0" r="3.0" fill="#F8FAFC"/>
          <text x="25" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">ChatStream</text>
        </g>
    </g>
        
    <!-- Orbit 5: C++ -->
    <path id="orbit_4" d="M 85,260 a 355,185 0 1,0 710,0 a 355,185 0 1,0 -710,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
        
    <g>
      <animateMotion path="M 85,260 a 355,185 0 1,0 710,0 a 355,185 0 1,0 -710,0" dur="72s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="9.5" fill="#F472B6" filter="url(#planetShade)"/>
      <circle cx="0" cy="0" r="11.5" fill="none" stroke="#F472B6" stroke-opacity="0.35" stroke-width="1"/>
      <text x="0" y="-13.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC">C++</text>
      
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
          <circle cx="19" cy="0" r="3.0" fill="#F8FAFC"/>
          <text x="24" y="3" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#E2E8F0" opacity="0.85">HackMe (1st)</text>
        </g>
    </g>
        
  </g>

  <!-- Central Sun (Diwakar / Diva143V) -->
  <g id="the_sun" transform="translate(440, 260)">
    <circle cx="0" cy="0" r="64" fill="url(#sunCorona)">
      <animate attributeName="r" values="64;74;64" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="48" fill="url(#sunCorona)" opacity="0.6"/>
    <circle cx="0" cy="0" r="32" fill="url(#sunCoreGrad)" stroke="#FFA726" stroke-width="1.5" filter="url(#sunBlur)"/>
    <circle cx="0" cy="0" r="32" fill="url(#sunCoreGrad)" stroke="#FFA726" stroke-width="1.5"/>

    <text x="0" y="-6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#7C2D12" letter-spacing="1">THE SUN</text>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="900" fill="#431407">DIVA</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#F8FAFC">Diwakar Venkat Peddada</text>
    <text x="0" y="57" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">17.68° N · 83.22° E</text>
  </g>

  <!-- Comet 1 -->
  <g>
    <animateMotion path="M -120,40 L 1000,240" dur="13s" repeatCount="indefinite"/>
    <line x1="-50" y1="0" x2="0" y2="0" stroke="url(#cometTail)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <text x="-60" y="-6" font-family="ui-monospace, monospace" font-size="7.5" fill="#38BDF8">commit push</text>
  </g>

  <!-- Comet 2 -->
  <g>
    <animateMotion path="M -100,420 L 980,180" dur="18s" repeatCount="indefinite"/>
    <line x1="-40" y1="0" x2="0" y2="0" stroke="url(#cometTail2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <text x="-50" y="-5" font-family="ui-monospace, monospace" font-size="7" fill="#F472B6">telemetry</text>
  </g>

  <!-- Legend -->
  <g transform="translate(28, 26)">
    <rect width="180" height="22" rx="4" fill="#080C1A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="12" cy="11" r="3.5" fill="#FFA726"/>
    <text x="22" y="15" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#FFA726" letter-spacing="0.5">SOLAR SYSTEM ENGINE</text>
  </g>
  <g transform="translate(640, 26)">
    <rect width="212" height="22" rx="4" fill="#080C1A" fill-opacity="0.85" stroke="#1E293B" stroke-width="0.8"/>
    <text x="106" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#94A3B8">planets = lang · moons = repos</text>
  </g>
