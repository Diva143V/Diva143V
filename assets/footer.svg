    </text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="11" fill="#22D3EE">
      COMM CHANNELS: GITHUB · LINKEDIN · X · PORTFOLIO · DIRECT EMAIL (diwa.p2007@gmail.com)
