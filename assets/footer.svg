      <stop offset="0%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
