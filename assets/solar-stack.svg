    <text x="168" y="93" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#C084FC">Orbit 2</text>
    <line x1="260" y1="89" x2="292" y2="89" stroke="#C084FC" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="292" cy="89" r="2" fill="#C084FC"/>
    <text x="306" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">Windows overlays, live captions, WPF</text>
    <text x="654" y="93" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#C084FC">LiveSubs</text>
  </g>
  <g>
    <circle cx="34" cy="120" r="4.5" fill="#FB923C"/>
