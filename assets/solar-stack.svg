        <line x1="-65" y1="0" x2="0" y2="0" stroke="url(#stackCometTail)" stroke-width="1.6" stroke-linecap="round"/>
        <circle r="3.6" fill="#38BDF8" opacity=".24"/>
        <circle r="1.6" fill="#F4F7FC"/>
      </g>
    </g>

    <g transform="translate(28 29)">
