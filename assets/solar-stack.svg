    <circle cx="292" cy="58" r="2" fill="#38BDF8"/>
    <text x="306" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">Biomedical RAG, local models, data pipelines</text>
    <text x="654" y="62" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#38BDF8">Griffin / SyGriffin</text>
  </g>
  <g>
    <circle cx="34" cy="89" r="4.5" fill="#C084FC"/>
