    <circle cx="268" cy="89" r="2.2" fill="#C084FC" class="sig-dot-1"/>
    <circle cx="298" cy="89" r="2" fill="#C084FC"/>
    <text x="308" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">Windows overlays, live captions, WPF</text>
    <text x="654" y="93" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#C084FC">LiveSubs</text>
  </g>
  <g>
