    <text x="168" y="124" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#FB923C">Orbit 3</text>
    <line x1="260" y1="120" x2="292" y2="120" stroke="#FB923C" stroke-opacity=".7" stroke-width="1.5"/>
