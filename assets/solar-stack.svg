<svg width="880" height="226" viewBox="0 0 880 226" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Languages and orbits</title>
  <desc id="desc">Five languages, the kind of work each one supports, and the projects that use them.</desc>
  <defs>
    <!-- Shooting star tail gradients (bright head, extra long tail) -->
    <linearGradient id="meteorTailGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFB020" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#FFD166" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#FFF3D6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="meteorTailCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#7DD3FC" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="meteorTailCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="stackBounds"><rect width="880" height="226" rx="14"/></clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .halo { animation: haloSoft 3.4s ease-in-out infinite; }
      .twinkle-a { animation: twinkle 3.8s ease-in-out infinite; }
      .twinkle-b { animation: twinkle 5.0s ease-in-out 1.1s infinite; }
      .twinkle-c { animation: twinkle 6.2s ease-in-out 2.0s infinite; }
      .meteor {
        opacity: 0;
        animation: shoot 3.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      }
      .m1 { animation-duration: 3.2s; animation-delay: 0.2s; }
      .m2 { animation-duration: 4.0s; animation-delay: 1.4s; }
      .m3 { animation-duration: 3.6s; animation-delay: 2.4s; }
      .m4 { animation-duration: 4.4s; animation-delay: 0.8s; }
      @keyframes shoot {
        0% {
          transform: translateX(0) scaleX(0.35);
          opacity: 0;
        }
        10% {
          opacity: 1;
          transform: translateX(70px) scaleX(1);
        }
        65% {
          opacity: 0.95;
        }
        100% {
          transform: translateX(540px) scaleX(0.5);
          opacity: 0;
        }
      }
      .mini-orbit-0 { transform-origin: 0px 0px; animation: spin 6.0s linear infinite; }
      .sig-dot-0 { animation: slidePulse 2.60s ease-in-out 0.00s infinite; }
      .conduit-0 { animation: dashCrawl 3.5s linear infinite; }
      .mini-orbit-1 { transform-origin: 0px 0px; animation: spin 8.5s linear infinite; }
      .sig-dot-1 { animation: slidePulse 3.05s ease-in-out 0.35s infinite; }
      .conduit-1 { animation: dashCrawl 4.1s linear infinite; }
      .mini-orbit-2 { transform-origin: 0px 0px; animation: spin 11.0s linear infinite; }
      .sig-dot-2 { animation: slidePulse 3.50s ease-in-out 0.70s infinite; }
      .conduit-2 { animation: dashCrawl 4.7s linear infinite; }
      .mini-orbit-3 { transform-origin: 0px 0px; animation: spin 13.5s linear infinite; }
      .sig-dot-3 { animation: slidePulse 3.95s ease-in-out 1.05s infinite; }
      .conduit-3 { animation: dashCrawl 5.3s linear infinite; }
      .mini-orbit-4 { transform-origin: 0px 0px; animation: spin 16.0s linear infinite; }
      .sig-dot-4 { animation: slidePulse 4.40s ease-in-out 1.40s infinite; }
      .conduit-4 { animation: dashCrawl 5.9s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes haloSoft { 0%, 100% { opacity: .10; } 50% { opacity: .30; } }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .82; } }
      @keyframes dashCrawl { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
      @keyframes slidePulse {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(30px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .halo, .twinkle-a, .twinkle-b, .twinkle-c, .mini-orbit-0, .mini-orbit-1, .mini-orbit-2, .mini-orbit-3, .mini-orbit-4, .sig-dot-0, .sig-dot-1, .sig-dot-2, .sig-dot-3, .sig-dot-4, .conduit-0, .conduit-1, .conduit-2, .conduit-3, .conduit-4, .meteor { animation: none !important; }
        .meteor { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#stackBounds)">
    <rect width="880" height="226" rx="14" fill="#080D18"/>
    <g>
    <circle cx="812" cy="26" r="0.8" fill="#F4F7FC" opacity="0.35" class="twinkle-a"/>
