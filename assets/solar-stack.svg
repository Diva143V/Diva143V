    <text x="306" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">React, Vite, interface work</text>
    <text x="654" y="155" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#60A5FA">myselfdiva</text>
  </g>
  <g>
    <circle cx="34" cy="182" r="4.5" fill="#F472B6"/>
    <text x="48" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F4F7FC">C++</text>
    <text x="168" y="186" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#F472B6">Orbit 5 / outer</text>
    <line x1="260" y1="182" x2="292" y2="182" stroke="#F472B6" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="292" cy="182" r="2" fill="#F472B6"/>
    <text x="306" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">Algorithms and data structures</text>
    <text x="654" y="186" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#F472B6">HackMe 2024</text>
