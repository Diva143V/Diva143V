    <text x="306" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#93A1B6">MCP server, graph core, Tauri</text>
    <text x="654" y="124" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#FB923C">Knox</text>
