    <text x="168" y="155" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#60A5FA">Orbit 4</text>
    <line x1="260" y1="151" x2="292" y2="151" stroke="#60A5FA" stroke-opacity=".7" stroke-width="1.5"/>
