    <text x="168" y="93" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#818CF8">Orbit 2</text>
