      <text x="18" y="9" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="10" font-weight="700" fill="#FFB020" letter-spacing="1.2">THE PLANETS // LANGUAGES &amp; ORBITS</text>
    </g>
    <line x1="28" y1="44" x2="852" y2="44" stroke="#1B2A44"/>

