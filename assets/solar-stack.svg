        <polygon points="-130,0 0,-2.4 0,2.4" fill="url(#meteorTailCyan)" />
        <polygon points="-72,0 0,-1.2 0,1.2" fill="url(#meteorTailCore)" opacity=".85" />
        <circle cx="0" cy="0" r="4.8" fill="#38BDF8" opacity=".35" />
        <circle cx="0" cy="0" r="3.0" fill="#38BDF8" opacity=".7" />
        <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" filter="url(#glow)" />
      </g>
    </g>
    <g transform="translate(470, -30) rotate(124)">
      <g class="meteor m2">
        <polygon points="-136,0 0,-3.5 0,3.5" fill="url(#meteorTailGold)" opacity=".38" />
        <polygon points="-130,0 0,-2.2 0,2.2" fill="url(#meteorTailGold)" />
        <polygon points="-72,0 0,-1.1 0,1.1" fill="url(#meteorTailCore)" opacity=".85" />
        <circle cx="0" cy="0" r="4.4" fill="#FFB020" opacity=".35" />
        <circle cx="0" cy="0" r="2.8" fill="#FFB020" opacity=".7" />
        <circle cx="0" cy="0" r="2.0" fill="#FFFFFF" filter="url(#glow)" />
      </g>
    </g>

    <g transform="translate(28 29)">
      <circle cx="5" cy="5" r="4" fill="#FFB020" class="pulse"/>
      <text x="18" y="9" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="10" font-weight="700" fill="#FFB020" letter-spacing="1.2">THE PLANETS // LANGUAGES &amp; ORBITS</text>
    </g>
    <line x1="28" y1="44" x2="852" y2="44" stroke="#1B2A44"/>

