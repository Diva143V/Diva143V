    <text x="168" y="62" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="400" fill="#38BDF8">Orbit 1 / inner</text>
    <line x1="268" y1="58" x2="298" y2="58" stroke="#38BDF8" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 4" class="conduit-0"/>
    <circle cx="268" cy="58" r="2.2" fill="#38BDF8" class="sig-dot-0"/>
