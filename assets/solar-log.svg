<svg width="880" height="148" viewBox="0 0 880 148" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Current orbit and record</title>
  <desc id="desc">AI developer intern at Aegion Dynamic Solutions, 185,000-person community moderator, first place at HackMe 2024, based in Visakhapatnam.</desc>
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB020" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
    <!-- Shooting star tail gradients (bright head, extra long tail) -->
    <linearGradient id="meteorTailGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFB020" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#FFD166" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#FFF3D6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="meteorTailCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#7DD3FC" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="meteorTailCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="logClip"><rect width="880" height="148" rx="14"/></clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .beacon { animation: pulse 2.4s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .twinkle-a { animation: twinkle 3.8s ease-in-out infinite; }
      .twinkle-b { animation: twinkle 5.2s ease-in-out 1.4s infinite; }
      .dot-0 { animation: pulse 2.6s ease-in-out 0s infinite; }
      .dot-1 { animation: pulse 2.6s ease-in-out .65s infinite; }
      .dot-2 { animation: pulse 2.6s ease-in-out 1.3s infinite; }
      .dot-3 { animation: pulse 2.6s ease-in-out 1.95s infinite; }
      .ping-0 { transform-origin: 179px 18px; animation: ping 3.2s ease-out 0s infinite; }
      .ping-1 { transform-origin: 179px 18px; animation: ping 3.2s ease-out .8s infinite; }
      .ping-2 { transform-origin: 179px 18px; animation: ping 3.2s ease-out 1.6s infinite; }
      .ping-3 { transform-origin: 179px 18px; animation: ping 3.2s ease-out 2.4s infinite; }
      .bar-0 { animation: barGlow 4.4s ease-in-out 0s infinite; }
      .bar-1 { animation: barGlow 4.4s ease-in-out 1.1s infinite; }
      .bar-2 { animation: barGlow 4.4s ease-in-out 2.2s infinite; }
      .bar-3 { animation: barGlow 4.4s ease-in-out 3.3s infinite; }
      .meteor {
        opacity: 0;
        animation: shoot 3.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      }
      .m1 { animation-duration: 3.2s; animation-delay: 0.2s; }
      .m2 { animation-duration: 4.0s; animation-delay: 1.4s; }
      .m3 { animation-duration: 3.6s; animation-delay: 2.4s; }
      .m4 { animation-duration: 4.4s; animation-delay: 0.8s; }
      @keyframes shoot {
        0% {
          transform: translateX(0) scaleX(0.35);
          opacity: 0;
        }
        10% {
          opacity: 1;
          transform: translateX(70px) scaleX(1);
        }
        65% {
          opacity: 0.95;
        }
        100% {
          transform: translateX(540px) scaleX(0.5);
          opacity: 0;
        }
      }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .8; } }
      @keyframes scan {
        0% { transform: translateX(-140px); opacity: 0; }
        10% { opacity: .9; }
        90% { opacity: .9; }
        100% { transform: translateX(880px); opacity: 0; }
      }
      @keyframes ping {
        0% { transform: scale(0.5); opacity: .7; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      @keyframes barGlow { 0%, 100% { opacity: .25; } 50% { opacity: .82; } }
      @media (prefers-reduced-motion: reduce) {
        .beacon, .scan, .twinkle-a, .twinkle-b,
        .dot-0, .dot-1, .dot-2, .dot-3,
        .ping-0, .ping-1, .ping-2, .ping-3,
        .bar-0, .bar-1, .bar-2, .bar-3, .meteor { animation: none !important; }
        .scan { display: none; }
        .meteor { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#logClip)">
    <rect width="880" height="148" rx="14" fill="#080D18"/>
    <g>
    <circle cx="760" cy="22" r="0.8" fill="#F4F7FC" opacity="0.35" class="twinkle-a"/>
    <circle cx="814" cy="28" r="1" fill="#F4F7FC" opacity="0.35" class="twinkle-b"/>
    <circle cx="848" cy="20" r="0.7" fill="#F4F7FC" opacity="0.35" class="twinkle-a"/>
    </g>
    <g transform="translate(790, -20) rotate(126)">
      <g class="meteor m1">
        <polygon points="-136,0 0,-3.8 0,3.8" fill="url(#meteorTailGold)" opacity=".38" />
        <polygon points="-130,0 0,-2.4 0,2.4" fill="url(#meteorTailGold)" />
        <polygon points="-72,0 0,-1.2 0,1.2" fill="url(#meteorTailCore)" opacity=".85" />
        <circle cx="0" cy="0" r="4.8" fill="#FFB020" opacity=".35" />
        <circle cx="0" cy="0" r="3.0" fill="#FFB020" opacity=".7" />
        <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" filter="url(#glow)" />
      </g>
    </g>
    <g transform="translate(510, -25) rotate(124)">
      <g class="meteor m2">
        <polygon points="-136,0 0,-3.5 0,3.5" fill="url(#meteorTailCyan)" opacity=".38" />
        <polygon points="-130,0 0,-2.2 0,2.2" fill="url(#meteorTailCyan)" />
        <polygon points="-72,0 0,-1.1 0,1.1" fill="url(#meteorTailCore)" opacity=".85" />
        <circle cx="0" cy="0" r="4.4" fill="#38BDF8" opacity=".35" />
        <circle cx="0" cy="0" r="2.8" fill="#38BDF8" opacity=".7" />
        <circle cx="0" cy="0" r="2.0" fill="#FFFFFF" filter="url(#glow)" />
      </g>
    </g>

    <g transform="translate(28 29)">
      <circle cx="5" cy="5" r="4" fill="#FFB020" class="beacon"/>
      <text x="18" y="9" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="10" font-weight="700" fill="#FFB020" letter-spacing="1.2">SOLAR LOG // CURRENT ORBIT</text>
    </g>
    <line x1="28" y1="42" x2="852" y2="42" stroke="#1B2A44"/>
    <rect x="0" y="41" width="140" height="2" fill="url(#scanGrad)" class="scan"/>

  <g transform="translate(28 48)">
    <rect width="195" height="80" rx="7" fill="#0C1424" stroke="#1B2A44"/>
    <rect x="0" y="77" width="195" height="3" rx="1.5" fill="#00E599" opacity=".45" class="bar-0"/>
    <circle cx="179" cy="18" r="2.6" fill="#00E599" class="dot-0"/>
    <circle cx="179" cy="18" r="6" fill="none" stroke="#00E599" stroke-opacity=".35" stroke-width=".8" class="ping-0"/>
    <text x="16" y="23" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9" font-weight="400" fill="#93A1B6" letter-spacing="0.7">CURRENT ORBIT</text>
    <text x="16" y="56" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="21.5" font-weight="800" fill="#00E599" letter-spacing="-0.4">AI INTERN</text>
    <text x="16" y="72" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#93A1B6">Aegion Dynamic</text>
  </g>
  <g transform="translate(238 48)">
    <rect width="195" height="80" rx="7" fill="#0C1424" stroke="#1B2A44"/>
    <rect x="0" y="77" width="195" height="3" rx="1.5" fill="#A855F7" opacity=".45" class="bar-1"/>
    <circle cx="179" cy="18" r="2.6" fill="#A855F7" class="dot-1"/>
    <circle cx="179" cy="18" r="6" fill="none" stroke="#A855F7" stroke-opacity=".35" stroke-width=".8" class="ping-1"/>
    <text x="16" y="23" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9" font-weight="400" fill="#93A1B6" letter-spacing="0.7">COMMUNITY</text>
    <text x="16" y="56" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="21.5" font-weight="800" fill="#A855F7" letter-spacing="-0.4">185K+</text>
    <text x="16" y="72" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#93A1B6">Mecha Break</text>
  </g>
  <g transform="translate(448 48)">
    <rect width="195" height="80" rx="7" fill="#0C1424" stroke="#1B2A44"/>
    <rect x="0" y="77" width="195" height="3" rx="1.5" fill="#EF4444" opacity=".45" class="bar-2"/>
    <circle cx="179" cy="18" r="2.6" fill="#EF4444" class="dot-2"/>
    <circle cx="179" cy="18" r="6" fill="none" stroke="#EF4444" stroke-opacity=".35" stroke-width=".8" class="ping-2"/>
    <text x="16" y="23" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9" font-weight="400" fill="#93A1B6" letter-spacing="0.7">PODIUM</text>
    <text x="16" y="56" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="21.5" font-weight="800" fill="#EF4444" letter-spacing="-0.4">1ST PLACE</text>
    <text x="16" y="72" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#93A1B6">HackMe 2024</text>
  </g>
  <g transform="translate(658 48)">
    <rect width="195" height="80" rx="7" fill="#0C1424" stroke="#1B2A44"/>
    <rect x="0" y="77" width="195" height="3" rx="1.5" fill="#F97316" opacity=".45" class="bar-3"/>
    <circle cx="179" cy="18" r="2.6" fill="#F97316" class="dot-3"/>
    <circle cx="179" cy="18" r="6" fill="none" stroke="#F97316" stroke-opacity=".35" stroke-width=".8" class="ping-3"/>
    <text x="16" y="23" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9" font-weight="400" fill="#93A1B6" letter-spacing="0.7">BASED IN</text>
    <text x="16" y="56" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="21.5" font-weight="800" fill="#F97316" letter-spacing="-0.4">Visakhapatnam</text>
    <text x="16" y="72" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="9.5" font-weight="400" fill="#93A1B6">India / UTC+05:30</text>
  </g>
  </g>
  <rect x=".5" y=".5" width="879" height="147" rx="13.5" stroke="#1B2A44"/>

</svg>
