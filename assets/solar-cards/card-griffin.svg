<svg width="430" height="168" viewBox="0 0 430 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Griffin: Evidence workbench</title>
  <desc id="desc">Griffin card: a biomedical evidence workbench using ChromaDB, Ollama and Reflex.</desc>
  <rect width="430" height="168" rx="11" fill="#080D18"/>
  <rect x=".5" y=".5" width="429" height="167" rx="10.5" stroke="#1B2A44"/>
  <rect width="3.5" height="168" rx="1.75" fill="#38BDF8"/>

  <g transform="translate(20 27)">
    <text x="0" y="0" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="700" fill="#38BDF8" letter-spacing="0.6">MOON 02 // BIOMEDICAL EVIDENCE</text>
    <text x="388" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5E6E85" text-anchor="end">↗</text>
  </g>
  <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F4F7FC">Griffin</text>
  <text x="20" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#F4F7FC">Collects biomedical papers and makes their claims comparable.</text>
  <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">Ten sources in, ChromaDB retrieval and local-model extraction out,</text>
  <text x="20" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">with contradictions surfaced instead of averaged away. Python and Reflex.</text>

  <g transform="translate(0 133)">
      <rect x="20.0" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="44.6" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Python</text>
      <rect x="75.2" y="0" width="61.6" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="106" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">ChromaDB</text>
      <rect x="142.8" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="167.4" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Ollama</text>
      <rect x="198.0" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="222.6" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Reflex</text>
  </g>

</svg>
