<svg width="430" height="168" viewBox="0 0 430 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LiveSubs: Windows captions</title>
  <desc id="desc">LiveSubs card: a Windows caption overlay that translates Windows Live Captions through Google, DeepL, OpenAI or Ollama.</desc>
  <rect width="430" height="168" rx="11" fill="#080D18"/>
  <rect x=".5" y=".5" width="429" height="167" rx="10.5" stroke="#1B2A44"/>
  <rect width="3.5" height="168" rx="1.75" fill="#4CC9F0"/>

  <g transform="translate(20 27)">
    <text x="0" y="0" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="700" fill="#4CC9F0" letter-spacing="0.6">MOON 01 // CAPTION OVERLAY</text>
    <text x="388" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5E6E85" text-anchor="end">↗</text>
  </g>
  <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F4F7FC">LiveSubs</text>
  <text x="20" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#F4F7FC">Reads Windows Live Captions and translates them in place.</text>
  <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">Sends the text through Google, DeepL, OpenAI or Ollama and pins both</text>
  <text x="20" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">lines above any app. C# and WPF on .NET 8, shipped as one executable.</text>

  <g transform="translate(0 133)">
      <rect x="20.0" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="39" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">C#</text>
      <rect x="64.0" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="83" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">WPF</text>
      <rect x="108.0" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="132.6" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">.NET 8</text>
      <rect x="163.2" y="0" width="55.4" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="190.9" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Windows</text>
  </g>

</svg>
