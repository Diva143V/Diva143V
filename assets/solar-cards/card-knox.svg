<svg width="430" height="168" viewBox="0 0 430 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Knox: MCP server</title>
  <desc id="desc">Knox card: a Rust MCP server and Tauri desktop app that keeps context across coding sessions.</desc>
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E28743" stop-opacity=".95"/>
      <stop offset="50%" stop-color="#F4F7FC" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity=".95"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap');
      .moon-spin { transform-origin: 0px 0px; animation: spin 8.9s linear infinite; }
      .ring-spin { transform-origin: 0px 0px; animation: spinRev 18s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .halo { animation: haloSoft 3.2s ease-in-out infinite; }
      .arrow-nudge { animation: nudge 2.8s ease-in-out infinite; }
      .twinkle-a { animation: twinkle 4.2s ease-in-out infinite; }
      .twinkle-b { animation: twinkle 5.6s ease-in-out 1.4s infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes haloSoft { 0%, 100% { opacity: .12; } 50% { opacity: .32; } }
      @keyframes nudge { 0%, 100% { transform: translate(0px, 0px); opacity: .65; } 50% { transform: translate(2px, -2px); opacity: 1; } }
      @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) {
        .moon-spin, .ring-spin, .pulse, .halo, .arrow-nudge, .twinkle-a, .twinkle-b { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="430" height="168" rx="11" fill="#080D18"/>
  <rect x=".5" y=".5" width="429" height="167" rx="10.5" stroke="#1B2A44"/>
  <rect width="3.5" height="168" rx="1.75" fill="#E28743" class="pulse"/>

  <circle cx="332" cy="144" r="0.9" fill="#F4F7FC" opacity=".35" class="twinkle-a"/>
  <circle cx="398" cy="128" r="1.0" fill="#E28743" opacity=".45" class="twinkle-b"/>
  <circle cx="408" cy="84" r="0.7" fill="#F4F7FC" opacity=".3" class="twinkle-a"/>

  <g transform="translate(366 42)">
    <circle r="15" fill="none" stroke="#E28743" stroke-opacity=".26" stroke-width=".9" stroke-dasharray="2.5 4" class="ring-spin"/>
    <circle r="5" fill="#E28743" opacity=".18" class="halo"/>
    <circle r="3.2" fill="#E28743"/>
    <g class="moon-spin">
      <circle cx="15" cy="0" r="2" fill="#F4F7FC"/>
      <circle cx="15" cy="0" r="4" fill="#E28743" opacity=".28"/>
    </g>
  </g>

  <g transform="translate(20 27)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#E28743" letter-spacing="0.6">MOON 03 // AGENT MEMORY</text>
    <g transform="translate(388 0)">
      <g class="arrow-nudge">
        <text x="0" y="0" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5E6E85" text-anchor="end">↗</text>
      </g>
    </g>
  </g>
  <text x="20" y="56" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F4F7FC">Knox</text>
  <text x="20" y="77" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#F4F7FC">Keeps decisions and context across coding sessions.</text>
  <text x="20" y="98" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">Eight tools over JSON-RPC, backed by a Rust graph core. The desktop</text>
  <text x="20" y="113" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">app is Tauri and React, with SQLite underneath.</text>

  <g transform="translate(0 133)">
      <rect x="20.0" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="39" y="13" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Rust</text>
      <rect x="64.0" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="83" y="13" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">MCP</text>
      <rect x="108.0" y="0" width="43.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="129.5" y="13" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Tauri</text>
      <rect x="157.0" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="181.6" y="13" font-family="'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SFMono-Regular', Consolas, ui-monospace, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">SQLite</text>
  </g>

</svg>
