<svg width="430" height="168" viewBox="0 0 430 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SyGriffin: Neoantigen CLI</title>
  <desc id="desc">SyGriffin card: a neoantigen CLI that reads tumour VCF files and predicts vaccine-relevant targets. A fork of Griffin.</desc>
  <rect width="430" height="168" rx="11" fill="#080D18"/>
  <rect x=".5" y=".5" width="429" height="167" rx="10.5" stroke="#1B2A44"/>
  <rect width="3.5" height="168" rx="1.75" fill="#F472B6"/>

  <g transform="translate(20 27)">
    <text x="0" y="0" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="700" fill="#F472B6" letter-spacing="0.6">MOON 04 // NEOANTIGENS</text>
    <text x="388" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5E6E85" text-anchor="end">↗</text>
  </g>
  <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#F4F7FC">SyGriffin</text>
  <text x="20" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#F4F7FC">The vaccine-target pipeline built on Griffin.</text>
  <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">Takes tumour VCF files and predicts vaccine-relevant targets with</text>
  <text x="20" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#93A1B6">binding scores you can inspect. A fork of Griffin.</text>

  <g transform="translate(0 133)">
      <rect x="20.0" y="0" width="49.2" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="44.6" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Python</text>
      <rect x="75.2" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="94.2" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">R</text>
      <rect x="119.2" y="0" width="38.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="138.2" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">VCF</text>
      <rect x="163.2" y="0" width="74.0" height="19" rx="3" fill="#0C1424" stroke="#1B2A44"/><text x="200.2" y="13" font-family="ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace" font-size="8.5" font-weight="400" fill="#F4F7FC" text-anchor="middle">Neoantigen</text>
  </g>

</svg>
