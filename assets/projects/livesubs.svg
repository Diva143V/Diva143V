            <rect x="63.0" y="0" width="46.0" height="20" rx="4" fill="#050510" stroke="#1E293B" stroke-width="1"/>
            <text x="86.0" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#F8FAFC">.NET</text>
            
            <rect x="117.0" y="0" width="173.5" height="20" rx="4" fill="#050510" stroke="#1E293B" stroke-width="1"/>
            <text x="203.75" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#F8FAFC">Windows Live Captions</text>
            
            <rect x="298.5" y="0" width="136.0" height="20" rx="4" fill="#050510" stroke="#1E293B" stroke-width="1"/>
            <text x="366.5" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#F8FAFC">Translation APIs</text>
            
            <rect x="442.5" y="0" width="158.5" height="20" rx="4" fill="#050510" stroke="#1E293B" stroke-width="1"/>
            <text x="521.75" y="14" text-anchor="middle" font-family="monospace" font-size="10" fill="#F8FAFC">DirectX/WPF Overlay</text>
            
  </g>

  <!-- Motif -->
  
