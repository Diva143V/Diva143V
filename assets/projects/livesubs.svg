<svg width="850" height="135" viewBox="0 0 850 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad_livesubs" x1="0" y1="0" x2="850" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#0D1530"/>
    </linearGradient>
  </defs>

  <rect width="850" height="135" rx="10" fill="url(#cardGrad_livesubs)"/>
  <rect x="0.5" y="0.5" width="849" height="134" rx="9.5" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="0" x2="4" y2="135" stroke="#22D3EE" stroke-width="4"/>

  <!-- Header line -->
  <g transform="translate(24, 22)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">
      LiveSubs
    </text>
    <rect x="106" y="-13" width="183.0" height="18" rx="3.5" fill="#050510" stroke="#22D3EE" stroke-width="1"/>
    <text x="113" y="0" font-family="monospace" font-size="9" font-weight="700" fill="#22D3EE">
      DESKTOP OVERLAY // SHIPPED
    </text>
    <text x="630" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="13" font-weight="700" fill="#22D3EE">
      7 &#9733;
    </text>
  </g>

  <!-- Tagline -->
  <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="12" font-weight="600" fill="#22D3EE">
    Real-Time Subtitle &amp; Translation Windows Desktop Overlay
  </text>

  <!-- Description -->
  <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11.5" fill="#94A3B8">
    Hooks Windows Live Captions, translates recognized speech via modular LLM/traditional APIs, and renders transparent always-on-top subtitles over any conference call or video.
  </text>

  <!-- Stack badges -->
  <g transform="translate(0, 96)">
    
            <rect x="24" y="0" width="31.0" height="20" rx="4" fill="#050510" stroke="#1E293B" stroke-width="1"/>
