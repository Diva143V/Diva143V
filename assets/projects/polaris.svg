    </text>
    <rect x="298" y="-13" width="176.5" height="18" rx="3.5" fill="#050510" stroke="#22D3EE" stroke-width="1"/>
    <text x="305" y="0" font-family="monospace" font-size="9" font-weight="700" fill="#22D3EE">
