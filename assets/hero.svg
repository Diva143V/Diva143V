<svg width="850" height="290" viewBox="0 0 850 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="850" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="nebulaCore" cx="720" cy="90" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B2CFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaGlowLeft" cx="120" cy="220" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="290" rx="14" fill="url(#heroBg)"/>
  <rect width="850" height="290" rx="14" fill="url(#nebulaCore)"/>
  <rect width="850" height="290" rx="14" fill="url(#nebulaGlowLeft)"/>
  <rect x="0.5" y="0.5" width="849" height="289" rx="13.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Starfield Grid -->
  <g opacity="0.65">
    <circle cx="85" cy="45" r="1" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="160" cy="110" r="1.5" fill="#22D3EE" opacity="0.6"/>
    <circle cx="230" cy="30" r="1" fill="#F8FAFC" opacity="0.5"/>
    <circle cx="340" cy="75" r="1.2" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="490" cy="40" r="1" fill="#A855F7" opacity="0.9"/>
    <circle cx="610" cy="85" r="1.5" fill="#22D3EE" opacity="0.8"/>
    <circle cx="750" cy="45" r="1.2" fill="#F8FAFC" opacity="0.9"/>
    <circle cx="790" cy="130" r="1" fill="#F8FAFC" opacity="0.6"/>
    <circle cx="680" cy="230" r="1.5" fill="#EC4899" opacity="0.7"/>
    <circle cx="530" cy="250" r="1" fill="#F8FAFC" opacity="0.5"/>
    <circle cx="380" cy="220" r="1.2" fill="#22D3EE" opacity="0.6"/>
    <circle cx="190" cy="240" r="1" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="70" cy="190" r="1.5" fill="#F8FAFC" opacity="0.7"/>
    <circle cx="290" cy="160" r="1" fill="#F8FAFC" opacity="0.4"/>
  </g>

  <!-- Constellation Geometric Vectors -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.5">
    <line x1="610" y1="85" x2="680" y2="120" stroke="#22D3EE" stroke-opacity="0.3"/>
    <line x1="680" y1="120" x2="750" y2="90" stroke="#22D3EE" stroke-opacity="0.3"/>
    <line x1="750" y1="90" x2="790" y2="130" stroke="#A855F7" stroke-opacity="0.3"/>
    <circle cx="680" cy="120" r="2.5" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="750" cy="90" r="2" fill="#A855F7"/>
  </g>

  <!-- Orbital Ring Geometry -->
  <g transform="translate(710, 110)">
    <ellipse cx="0" cy="0" rx="90" ry="28" transform="rotate(-25)" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="5 3"/>
    <ellipse cx="0" cy="0" rx="65" ry="65" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="#0D1530" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="-12" cy="-10" r="3" fill="#EC4899" opacity="0.8"/>
    <circle cx="8" cy="14" r="2" fill="#22D3EE" opacity="0.7"/>
    <circle cx="48" cy="-22" r="3" fill="#22D3EE" filter="url(#glow)"/>
  </g>

  <!-- Telemetry Coordinate Tag -->
  <g transform="translate(42, 42)">
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#0D1530" stroke="#1E293B" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#22D3EE" filter="url(#glow)"/>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#22D3EE" letter-spacing="1">ORBIT 17.68° N · 83.22° E</text>
  </g>

  <!-- Name & Header Display -->
  <text x="42" y="112" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, &apos;Space Grotesk&apos;, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    DIWAKAR VENKAT PEDDADA
  </text>

  <!-- Identity Subtitle Badge -->
  <g transform="translate(42, 128)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="12.5" font-weight="600" fill="url(#neonGrad)" letter-spacing="1.5">
      SYSTEMS &amp; REAL-TIME SOFTWARE  //  BIOMEDICAL AI  //  KNOWLEDGE GRAPHS
    </text>
  </g>

  <!-- Philosophical Tagline -->
  <text x="42" y="185" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14.5" fill="#94A3B8">
    Architecting software that keeps pace with real-time reality — from millisecond Windows
  </text>
  <text x="42" y="208" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="14.5" fill="#94A3B8">
    caption overlays to multi-source biomedical research synthesis and reasoning engines.
  </text>

  <!-- HUD Badges -->
  <g transform="translate(42, 238)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="175" height="26" rx="5" fill="#0D1530" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">ANDHRA UNIVERSITY · CS &apos;28</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="180" height="26" rx="5" fill="#0D1530" stroke="#1E293B" stroke-width="1"/>
    <text x="197" y="17" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#22D3EE">AI DEV INTERN @ AEGION</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="165" height="26" rx="5" fill="#0D1530" stroke="#1E293B" stroke-width="1"/>
    <text x="387" y="17" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A855F7">185K+ COMMUNITY MOD</text>
  </g>
</svg>