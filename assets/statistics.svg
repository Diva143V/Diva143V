<svg width="850" height="165" viewBox="0 0 850 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statBg" x1="0" y1="0" x2="850" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1024"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="165" rx="12" fill="url(#statBg)"/>
  <rect x="0.5" y="0.5" width="849" height="164" rx="11.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Status Bar -->
  <line x1="25" y1="36" x2="825" y2="36" stroke="#1E293B" stroke-width="1"/>
  <circle cx="34" cy="22" r="4" fill="#22D3EE" filter="url(#statGlow)"/>
  <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="11" font-weight="700" fill="#22D3EE" letter-spacing="1">
    TELEMETRY // VERIFIED GITHUB AUDIT METRICS
  </text>
  <text x="825" y="26" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="10.5" fill="#94A3B8">
    LIVE SYNC ENGINE
  </text>

  <!-- Metric 1: Public Repositories -->
  <g transform="translate(30, 52)">
