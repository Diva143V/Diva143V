    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">COMMUNITY SCALE</text>
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="30" font-weight="800" fill="#A855F7">185K+</text>
    <text x="112" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="11" fill="#94A3B8">moderated</text>
