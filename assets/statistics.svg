    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">23</text>
    <text x="64" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="11" fill="#22D3EE">audited</text>
  </g>

  <!-- Metric 2: Stars Earned -->
  <g transform="translate(230, 52)">
    <rect width="180" height="92" rx="8" fill="#0D1530" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">REPOSITORY STARS</text>
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif" font-size="32" font-weight="800" fill="#22D3EE">16 &#9733;</text>
    <text x="96" y="66" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, monospace" font-size="11" fill="#94A3B8">organic</text>
