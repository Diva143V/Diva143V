name: Refresh NEBULA Profile

on:
  schedule:
    # Refresh every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run NEBULA Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_profile.py

      - name: Validate Profile Integrity & SVGs
        run: |
          python scripts/validate_profile.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --staged --quiet; then
            echo "No changes detected. Profile telemetry is up to date."
          else
            git commit -m "chore(telemetry): auto-refresh NEBULA profile metrics [skip ci]"
            git push
          fi
