name: Profile

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/profile.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generated files are current
        run: python scripts/build_profile.py --check

      - name: Validate profile
        run: python scripts/validate_profile.py
